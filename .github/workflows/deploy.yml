name: Deploy to GCE

on:
  push:
    branches: [main]
  # Allows a manual redeploy from the Actions tab without pushing a commit
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/discord-leaderboard
            git fetch origin main
            # Hard reset (not pull) so local drift never blocks a deploy. This
            # only touches tracked files: .env, credentials/ and
            # data/server-state.json are gitignored and survive untouched.
            # NEVER add `git clean` here — it would delete all three.
            git reset --hard origin/main
            npm ci --omit=dev
            # Needs the NOPASSWD sudoers rule from GUIDE.md §5.3
            sudo systemctl restart discord-leaderboard
            # Fail the deploy if the service didn't come back up
            # (is-active needs no root, so no extra sudoers rule)
            sleep 5
            systemctl is-active --quiet discord-leaderboard
